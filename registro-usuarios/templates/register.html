{% extends "base.html" %}
{% block title %}Crear cuenta{% endblock %}
{% block content %}
<h1>Crear cuenta</h1>
<form method="post" action="{{ url_for('register') }}">
  <label>Usuario
    <input name="username" required>
  </label>
  <label>Contraseña
    <input type="password" name="password" required>
  </label>
  <label>Tipo de cuenta
    <select name="rol">
      <option value="asistente">Asistente de caja (registra ventas)</option>
      {% if permitir_admin %}<option value="contador">Administrador (Contador: ve todo y avanza el DTE)</option>{% endif %}
    </select>
  </label>
  <button type="submit">Registrarme</button>
</form>
<div class="links">¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión</a></div>
{% endblock %}
