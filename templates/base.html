<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Restaurant{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #f2f4f7; margin: 0;
           display: flex; justify-content: center; padding: 40px 16px; min-height: 100vh; }
    .card { background: #fff; padding: 28px; border-radius: 12px; width: 100%;
            max-width: 420px; box-shadow: 0 4px 16px rgba(0,0,0,.08); height: fit-content; }
    .card.wide { max-width: 72rem; padding: 2rem; border-radius: 1rem; }
    /* Large panel: everything scales with the window width */
    html:has(.card.wide) { font-size: clamp(16px, 1.15vw, 34px); }
    html:has(.card.wide) body { padding: 2rem 1rem; }
    .card.wide table { font-size: 1rem; }
    .card.wide th, .card.wide td { padding: .7rem .8rem; }
    .card.wide h1 { font-size: 1.8rem; }
    .card.wide h2 { font-size: 1.3rem; }
    .card.wide .badge { font-size: .9rem; }
    .card.wide .small-btn { font-size: .95rem; padding: .5rem .9rem; }
    .card.wide .btn { font-size: 1.05rem; padding: .85rem; }
    .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
    .data-btn { background: #16a34a; color: #fff; text-decoration: none; padding: .55rem 1.3rem;
                border-radius: 8px; font-weight: 600; }
    .data-btn:hover { background: #15803d; }
    .dte-btn { background: #722f37; color: #fff; text-decoration: none; padding: .55rem 1.3rem;
               border-radius: 8px; font-weight: 600; }
    .dte-btn:hover { background: #5a232b; }
    .menu { position: relative; display: inline-block; }
    .menu-items { display: none; position: absolute; right: 0; top: 100%; z-index: 5; background: #fff;
                  border: 1px solid #e2e8f0; border-radius: 8px; box-shadow: 0 4px 12px #0002; min-width: 170px; }
    .menu:hover .menu-items, .menu:focus-within .menu-items { display: block; }
    .menu-items a { display: block; padding: 9px 14px; color: #722f37; text-decoration: none; white-space: nowrap; }
    .menu-items a:hover { background: #f5e9ea; }
    h1 { font-size: 1.4rem; margin-top: 0; }
    h2 { font-size: 1.1rem; margin-top: 28px; }
    label { display: block; margin-top: 14px; font-size: .9rem; color: #333; }
    input, select { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #ccd;
                    border-radius: 8px; font-size: 1rem; }
    button, .btn { margin-top: 14px; width: 100%; padding: 11px; border: 0; border-radius: 8px;
                   background: #2563eb; color: #fff; font-size: 1rem; cursor: pointer;
                   text-align: center; display: block; text-decoration: none; }
    .btn-sec { background: #64748b; margin-top: 24px; }
    .flash { background: #fff4e5; border: 1px solid #f5c26b; padding: 10px; border-radius: 8px;
             margin-bottom: 14px; font-size: .9rem; }
    .ok { background: #ecfdf5; border-color: #6ee7b7; }
    .links { margin-top: 16px; font-size: .9rem; text-align: center; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: .95rem; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eee; }
    .badge { background: #dbeafe; color: #1e40af; padding: 2px 8px; border-radius: 999px; font-size: .8rem; }
    .small-btn { width: auto; margin: 0; padding: 6px 10px; font-size: .85rem; background: #0f766e; }
    .stats { display: flex; gap: 10px; flex-wrap: wrap; }
    .stats div { flex: 1; min-width: 110px; background: #f8fafc; border: 1px solid #e2e8f0;
                 border-radius: 10px; padding: 12px; text-align: center; }
    .stats b { display: block; font-size: 1.5rem; }
    .stats span { font-size: .8rem; color: #64748b; }
  </style>
</head>
<body>
  <div class="card {% block cardclass %}{% endblock %}">
    {% with mensajes = get_flashed_messages() %}
      {% for m in mensajes %}
        <div class="flash {% if m.startswith('User created') or m.startswith('Sale') %}ok{% endif %}">{{ m }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
