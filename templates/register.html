{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<h1>Create account</h1>
<form method="post" action="{{ url_for('register') }}">
  <label>Username
    <input name="username" required>
  </label>
  <label>Password
    <input type="password" name="password" required>
  </label>
  <label>Account type
    <select name="rol">
      <option value="asistente">Cashier assistant (records sales)</option>
      {% if permitir_admin %}<option value="admin">Administrator (sees everything and advances the DTE)</option>{% endif %}
    </select>
  </label>
  <button type="submit">Sign up</button>
</form>
<div class="links">Already have an account? <a href="{{ url_for('login') }}">Log in</a></div>
{% endblock %}
